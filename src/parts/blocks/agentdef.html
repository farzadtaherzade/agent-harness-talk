          <p class="def-line" style="--c:#8497b1"><b>مدل</b> = تابعی بی‌حافظه: متن در، متن بیرون. نه دست دارد، نه حافظه، نه ساعت.</p>
          <p class="def-line" style="--c:#38bdf8"><b>ایجنت</b> = رفتار: دنبال یک هدف، در چند گام. گام بعدی را خودش انتخاب می‌کند و خودش هم متوقف می‌شود.</p>
          <p class="def-line" style="--c:#10b981"><b>هارنس</b> = کدی که این رفتار را ممکن می‌کند: پرامپت، ابزار، حلقه، گاردریل، بودجه، حافظه، لاگ.</p>
